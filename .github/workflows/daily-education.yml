name: Daily First1Saudi Education

on:
  workflow_dispatch:

jobs:
  daily-education:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm educational automation is disabled
        run: |
          response=$(curl -s -X POST \
            "${{ secrets.APP_BASE_URL }}/api/cron/daily-education" \
            -H "x-api-key: ${{ secrets.CRON_API_KEY }}" \
            -H "Content-Type: application/json" \
            --max-time 290)
          echo "$response"
          echo "$response" | grep -q '"disabled":true'
